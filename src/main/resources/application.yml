ripplemap:
  # H2 database and stored imports live here. Override with RIPPLEMAP_DATA_DIR or --ripplemap.data-dir=...
  data-dir: ${RIPPLEMAP_DATA_DIR:${user.home}/.ripplemap}
  analysis:
    concurrency: 2
    queue-capacity: 16
    timeout: 10m
    reference-budget: 2s
    language-level: JAVA_21
    max-java-files: 10000
    max-file-size: 2MB
    max-diagnostics: 5000
    max-reference-samples: 20
    max-snapshots-per-project: 100
    node-metrics-limit: 20000
    cache-size: 8
    worker-stack-size: 64MB
  import:
    max-upload-size: 50MB
    max-expanded-size: 200MB
    max-entry-size: 2MB
    max-entries: 20000
    max-java-files: 10000
    max-path-depth: 40
    max-path-length: 512
    max-compression-ratio: 200
    max-stored-size: 2GB
  local-scan:
    # Directories below which local projects may be registered and rescanned. Empty = disabled.
    allowed-roots: []
  graph:
    max-response-nodes: 2000
    max-impact-entries: 5000
    max-comparison-entries: 500
  security:
    allowed-hosts: [localhost, 127.0.0.1, "[::1]"]

server:
  address: 127.0.0.1
  port: ${RIPPLEMAP_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 60MB
  shutdown: graceful

spring:
  application:
    name: ripplemap
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:file:${ripplemap.data-dir}/db/ripplemap;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: ripplemap
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${ripplemap.import.max-upload-size}
      max-request-size: 55MB
      file-size-threshold: 1MB
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  # intentionally enabled: the API documentation is part of this local tool (served only on 127.0.0.1)
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: false

logging:
  level:
    root: INFO
    com.ripplemap: INFO
    org.hibernate.orm.deprecation: ERROR
    com.github.javaparser: WARN
